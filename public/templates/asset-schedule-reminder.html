<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #ffffff; margin: 0; padding: 0; -webkit-font-smoothing: antialiased;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff; padding: 30px 0;">
        <tr>
            <td align="center">
                <!-- Logo Header -->
                <table width="680" cellpadding="0" cellspacing="0" style="max-width: 680px;">
                    <tr>
                        <td align="center" style="padding: 32px 0 24px;">
                            <table cellpadding="0" cellspacing="0" border="0" style="margin: 0 auto;">
                                <tr>
                                    <td align="center" valign="middle" style="height: 44px; width: 44px;">
                                        <img src="https://res.cloudinary.com/dzhz6phgq/image/upload/v1785229371/logo_fzdgmy.png" alt="Logo" width="148" style="display: block;">
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>

                <!-- Main Card -->
                <table width="680" cellpadding="0" cellspacing="0" style="max-width: 680px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
                    <!-- Banner -->
                    <tr>
                        <td style="padding: 20px 24px 0;">
                            <table width="100%" cellpadding="0" cellspacing="0" style="background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%); border-radius: 12px;">
                                <tr>
                                    <td align="center" style="padding: 32px 20px;">
                                        <img src="https://res.cloudinary.com/dzhz6phgq/image/upload/v1782380741/a_vophta.png" alt="Reset Password" width="180" style="max-width: 180px; height: auto;">
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- Content -->
                    <tr>
                        <td style="padding: 28px 36px 8px;">
                            <p style="font-size: 16px; font-weight: 700; color: #21222E; margin: 0 0 20px;">Hello, {{name}} 👋</p>

                            <p style="font-size: 14px; line-height: 1.75; color: #656976; margin: 0 0 20px;">This is a reminder for a scheduled item today, <strong>{{date}}</strong>:</p>

                            <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; margin: 0 0 20px;">
                                <tr>
                                    <td style="padding: 18px 20px;">
                                        <p style="font-size: 15px; font-weight: 700; color: #21222E; margin: 0 0 6px;">{{title}}</p>
                                        <p style="font-size: 13px; color: #009838; font-weight: 600; margin: 0 0 12px;">{{recurrenceLabel}}</p>
                                        <p style="font-size: 13px; color: #656976; margin: 0 0 12px; line-height: 1.6;">{{description}}</p>
                                        <p style="font-size: 12px; font-weight: 700; color: #9CA3AF; text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 6px;">Assets</p>
                                        <div style="font-size: 13px; color: #21222E; line-height: 1.8;">{{assets}}</div>
                                    </td>
                                </tr>
                            </table>

                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="padding: 4px 0 24px;">
                                        <a href="{{calendarLink}}" style="display: inline-block; background: linear-gradient(135deg, #009838 0%, #007a2d 100%); color: #ffffff; padding: 13px 44px; text-decoration: none; font-size: 14px; font-weight: 600; border-radius: 8px; letter-spacing: 0.3px;">View in SIMAS</a>
                                    </td>
                                </tr>
                            </table>

                            <p style="font-size: 14px; color: #656976; margin: 0 0 28px; line-height: 1.6;">Best regards,<br><strong style="color: #656976;">SIMAS Team</strong></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
